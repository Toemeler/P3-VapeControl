<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
    a { color: #FF6A00; } a:hover { color: #E05D00; }
    @keyframes riseC { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-16px); opacity: 0; } }
    @keyframes glowC { 0%, 100% { opacity: 0.22; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.06); } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #000000; color: #FFFFFF; display: flex; flex-direction: column;">

  <div style="height: 44px;"></div>

  <div style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
    <div style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 12px; background: #2C2C2E; border-radius: 19px;">
      <div style="width: 8px; height: 8px; border-radius: 4px; background: #30D158;"></div>
      <div style="font-size: 15px; font-weight: 600;">Paxie</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 38px; height: 38px; border-radius: 19px; background: #2C2C2E; display: flex; align-items: center; justify-content: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M4.2 12a7.8 7.8 0 0 1 .3-2.1l-2-1.5 2-3.4 2.3 1a7.8 7.8 0 0 1 1.8-1l.3-2.5h4l.3 2.5c.65.26 1.25.6 1.8 1l2.3-1 2 3.4-2 1.5a7.8 7.8 0 0 1 0 4.2l2 1.5-2 3.4-2.3-1a7.8 7.8 0 0 1-1.8 1l-.3 2.5h-4l-.3-2.5a7.8 7.8 0 0 1-1.8-1l-2.3 1-2-3.4 2-1.5A7.8 7.8 0 0 1 4.2 12z"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;">

    <div style="position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center;">
      <svg width="300" height="300" viewBox="0 0 300 300" style="position: absolute; inset: 0;">
        <circle cx="150" cy="150" r="128" fill="none" stroke="#1C1C1E" stroke-width="20" stroke-linecap="round"
                stroke-dasharray="603.2 804.2" transform="rotate(135 150 150)"/>
        <circle cx="150" cy="150" r="128" fill="none" stroke="#30D158" stroke-width="20" stroke-linecap="round"
                stroke-dasharray="573.0 804.2" transform="rotate(135 150 150)" opacity="0.9"/>
      </svg>
      <div style="position: absolute; width: 190px; height: 190px; border-radius: 95px; background: radial-gradient(circle, rgba(48,209,88,0.5) 0%, rgba(48,209,88,0) 68%); animation: glowC 3.2s ease-in-out infinite;"></div>

      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <svg width="44" height="56" viewBox="0 0 11 14" fill="#30D158"><path d="M6.4 0 0 8h4l-.6 6L11 6H6.8z"/></svg>
        <div style="display: flex; align-items: baseline; gap: 2px;">
          <div style="font-size: 44px; font-weight: 600; letter-spacing: -1.4px; font-variant-numeric: tabular-nums;">95</div>
          <div style="font-size: 17px; font-weight: 600; color: rgba(235,235,245,0.6);">%</div>
        </div>
      </div>

      <div style="position: absolute; bottom: 26px; display: flex; gap: 7px;">
        <div style="width: 4px; height: 4px; border-radius: 2px; background: #30D158; animation: riseC 2.4s ease-out infinite;"></div>
        <div style="width: 4px; height: 4px; border-radius: 2px; background: #30D158; animation: riseC 2.4s ease-out infinite 0.5s;"></div>
        <div style="width: 4px; height: 4px; border-radius: 2px; background: #30D158; animation: riseC 2.4s ease-out infinite 1s;"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 14px;">
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.4px;">Charging</div>
      <div style="font-size: 15px; color: rgba(235,235,245,0.6); font-variant-numeric: tabular-nums;">Oven off · 48.0 °C</div>
    </div>
  </div>

  <div style="height: 78px;"></div>
</div>
</x-dc>
</body>
</html>
