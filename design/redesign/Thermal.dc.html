<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&family=Barlow:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Barlow, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #FF8A3D; } a:hover { color: #E2571B; }
    .lbl { font-size: 9.5px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(237,234,227,0.42); }
    .key { border-radius: 3px; background: #262522; box-shadow: inset 0 1px 0 rgba(255,255,255,0.055); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #1B1A18; color: #EDEAE3; display: flex; flex-direction: column;">

  <div style="height: 44px;"></div>

  <div style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 20px;">
    <div class="lbl" style="color: #EDEAE3;">pax 3</div>
    <div style="width: 1px; height: 10px; background: rgba(237,234,227,0.18);"></div>
    <div class="lbl">linked</div>
    <div style="flex-grow: 1;"></div>
    <div class="lbl" style="color: rgba(237,234,227,0.7);">78%</div>
    <div class="key" style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(237,234,227,0.7)" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </div>
  </div>

  <!-- the oven as a column of heat: cold at the foot, the draw temperature at the meniscus -->
  <div style="display: flex; gap: 16px; padding: 16px 20px 0; align-items: center;">

    <div style="position: relative; width: 50px; height: 348px; border-radius: 3px; background: #201F1C; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 83.79%; border-radius: 0 0 3px 3px; background: linear-gradient(to top, #4A1704 0%, #8E3009 34%, #C2450F 68%, #E2571B 92%, #FF8A3D 100%);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 83.79%; height: 1.5px; background: #FFC79A;"></div>
      <!-- target index, machined into the outside edge -->
      <div style="position: absolute; left: -9px; bottom: 83.59%; width: 8px; height: 8px; margin-bottom: -4px; background: #EDEAE3; clip-path: polygon(0 0, 100% 50%, 0 100%);"></div>
    </div>

    <div style="position: relative; width: 40px; height: 348px;">
      <div style="position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px;">
        <div style="width: 7px; height: 1px; background: rgba(237,234,227,0.3);"></div>
        <div class="lbl" style="letter-spacing: 0.1em;">225</div>
      </div>
      <div style="position: absolute; left: 0; top: 5.13%; display: flex; align-items: center; gap: 5px; margin-top: -5px;">
        <div style="width: 7px; height: 1px; background: rgba(237,234,227,0.3);"></div>
        <div class="lbl" style="letter-spacing: 0.1em;">215</div>
      </div>
      <div style="position: absolute; left: 0; top: 23.08%; display: flex; align-items: center; gap: 5px; margin-top: -5px;">
        <div style="width: 7px; height: 1px; background: rgba(237,234,227,0.3);"></div>
        <div class="lbl" style="letter-spacing: 0.1em;">180</div>
      </div>
      <div style="position: absolute; left: 0; bottom: 0; display: flex; align-items: center; gap: 5px;">
        <div style="width: 7px; height: 1px; background: rgba(237,234,227,0.3);"></div>
        <div class="lbl" style="letter-spacing: 0.1em;">cold</div>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start;">
      <div class="lbl">oven</div>
      <div style="font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-size: 108px; font-weight: 500; line-height: 0.82; letter-spacing: -0.01em; padding-top: 6px;">193<span style="color: rgba(237,234,227,0.55);">.4</span></div>
      <div class="lbl" style="padding-top: 6px;">degrees celsius</div>
      <div style="width: 100%; height: 1px; background: rgba(237,234,227,0.12); margin: 16px 0 12px;"></div>
      <div style="display: flex; align-items: center; gap: 7px;">
        <div style="width: 6px; height: 6px; background: #EDEAE3;"></div>
        <div class="lbl" style="color: #EDEAE3;">ready</div>
      </div>
    </div>
  </div>

  <!-- target -->
  <div class="key" style="margin: 24px 20px 0; height: 64px; display: flex; align-items: center; padding: 0 8px 0 16px; gap: 10px;">
    <div style="flex-grow: 1;">
      <div class="lbl">target</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 500; line-height: 1.05;">193<span style="color: rgba(237,234,227,0.5);">&#8202;&#176;C</span></div>
    </div>
    <div style="width: 46px; height: 46px; border-radius: 3px; background: #302E2A; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#EDEAE3" stroke-width="1.7"><path d="M3 8h10"/></svg>
    </div>
    <div style="width: 46px; height: 46px; border-radius: 3px; background: #302E2A; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#EDEAE3" stroke-width="1.7"><path d="M3 8h10M8 3v10"/></svg>
    </div>
  </div>

  <!-- presets -->
  <div style="display: flex; gap: 8px; margin: 12px 20px 0;">
    <div class="key" style="flex-grow: 1; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;">180&#176;</div>
    <div style="flex-grow: 1; height: 46px; border-radius: 3px; background: #2A211B; box-shadow: inset 0 0 0 1px #E2571B; color: #FF8A3D; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;">193&#176;</div>
    <div class="key" style="flex-grow: 1; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;">204&#176;</div>
    <div class="key" style="flex-grow: 1; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;">215&#176;</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- heating mode: five flat keys, the live one lit along its top edge -->
  <div style="margin: 0 20px 26px;">
    <div class="lbl" style="padding-bottom: 9px;">heating mode</div>
    <div style="display: flex; gap: 7px;">
      <div style="flex-grow: 1; height: 62px; border-radius: 3px; background: #302E2A; box-shadow: inset 0 2px 0 #E2571B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding-top: 2px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEAE3" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg>
        <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em;">standard</div>
      </div>
      <div class="key" style="flex-grow: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; color: rgba(237,234,227,0.5);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.5 3.8-1.9 5.5-3.6 7.4A8.3 8.3 0 0 0 6 16a6 6 0 0 0 12 .4c0-2.7-1.2-4.4-2.3-5.9-.4 1-1.2 1.7-2 2 .7-3.1-.3-7-1.7-9.5z"/></svg>
        <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em;">boost</div>
      </div>
      <div class="key" style="flex-grow: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; color: rgba(237,234,227,0.5);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c0-8 5.5-13 16-13 0 9-5.5 13-13 13H4z"/></svg>
        <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em;">effic.</div>
      </div>
      <div class="key" style="flex-grow: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; color: rgba(237,234,227,0.5);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em;">stealth</div>
      </div>
      <div class="key" style="flex-grow: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; color: rgba(237,234,227,0.5);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.7 4.3 4.3 1.7-4.3 1.7L12 15.5l-1.7-4.3L6 9.5l4.3-1.7z"/><path d="M18.2 16l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
        <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em;">flavour</div>
      </div>
    </div>
  </div>

  <div style="height: 34px;"></div>
</div>
</x-dc>
</body>
</html>
