<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif; }
    a { color: #A8471F; } a:hover { color: #86350F; }
    .tag { font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
  </style>
</helmet>

<!-- The whole display is the control. Drag anywhere to move the boundary;
     there is no dial, no stepper and no preset row. Seven elements in total. -->
<div style="width: 390px; height: 844px; background: #F2EDE4; color: #211C16; position: relative; overflow: hidden;">

  <div style="height: 44px;"></div>

  <div style="display: flex; align-items: center; height: 34px; padding: 0 28px;">
    <div class="tag" style="color: rgba(33,28,22,0.55);">pax 3</div>
    <div style="flex-grow: 1;"></div>
    <div class="tag" style="color: rgba(33,28,22,0.55);">78%</div>
  </div>

  <!-- battery: a hairline down the left edge, bottom-anchored. No number, no icon. -->
  <div style="position: absolute; left: 0; bottom: 0; width: 2px; height: 78%; background: rgba(33,28,22,0.22);"></div>

  <!-- the field: its height IS the target. 28.9% of 180-225. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 28.889%; background: linear-gradient(to bottom, #A8471F 0%, #8A3614 100%);"></div>
  <!-- what the oven actually reads, chasing the line you set -->
  <div style="position: absolute; left: 0; right: 0; bottom: 29.778%; height: 1.5px; background: rgba(33,28,22,0.35);"></div>
  <div class="tag" style="position: absolute; left: 28px; bottom: 31.6%; color: rgba(33,28,22,0.5);">oven 193.4&#176; &#183; ready</div>

  <!-- the number is the handle: it rides the boundary -->
  <div style="position: absolute; left: 28px; bottom: 28.889%; padding-bottom: 14px;">
    <div class="tag" style="color: rgba(33,28,22,0.45); padding-bottom: 2px;">target</div>
    <div style="display: flex; align-items: baseline; gap: 6px;">
      <div style="font-size: 124px; font-weight: 500; letter-spacing: -0.06em; line-height: 0.82;">193</div>
      <div style="font-size: 26px; font-weight: 500; color: rgba(33,28,22,0.45);">&#176;C</div>
    </div>
  </div>

  <!-- detents: flick to one of the four along the right edge -->
  <div style="position: absolute; right: 0; bottom: 0; top: 0;">
    <div style="position: absolute; right: 0; bottom: 0; display: flex; align-items: center; gap: 7px;">
      <div class="tag" style="color: rgba(33,28,22,0.4); font-size: 9px;">180</div>
      <div style="width: 14px; height: 1.5px; background: rgba(33,28,22,0.3);"></div>
    </div>
    <div style="position: absolute; right: 0; bottom: 28.889%; display: flex; align-items: center; gap: 7px; margin-bottom: -1px;">
      <div class="tag" style="color: #8A3614; font-size: 9px;">193</div>
      <div style="width: 22px; height: 2px; background: #8A3614;"></div>
    </div>
    <div style="position: absolute; right: 0; bottom: 53.333%; display: flex; align-items: center; gap: 7px;">
      <div class="tag" style="color: rgba(33,28,22,0.4); font-size: 9px;">204</div>
      <div style="width: 14px; height: 1.5px; background: rgba(33,28,22,0.3);"></div>
    </div>
    <div style="position: absolute; right: 0; bottom: 77.778%; display: flex; align-items: center; gap: 7px;">
      <div class="tag" style="color: rgba(33,28,22,0.4); font-size: 9px;">215</div>
      <div style="width: 14px; height: 1.5px; background: rgba(33,28,22,0.3);"></div>
    </div>
  </div>

  <!-- mode: swipe the field sideways. One line, inside the heat. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 34px; height: 48px; display: flex; align-items: center; justify-content: center; gap: 18px; color: #F6EDE2;">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(246,237,226,0.5)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
    <div class="tag" style="font-size: 12px; letter-spacing: 0.2em;">standard</div>
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(246,237,226,0.5)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
  </div>

</div>
</x-dc>
</body>
</html>
