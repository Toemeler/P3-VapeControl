<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: "Space Grotesk", "Helvetica Neue", system-ui, sans-serif; }
    a { color: #B4471F; } a:hover { color: #8F3616; }
    .mono { font-family: "Space Mono", ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #7A776C; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FBFAF6; color: #1A1914; display: flex; flex-direction: column;">

  <div style="height: 44px;"></div>

  <div style="height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 20px;">
    <div class="mono" style="color: #1A1914;">pax 3</div>
    <div style="width: 1px; height: 9px; background: rgba(26,25,20,0.2);"></div>
    <div class="mono">linked</div>
    <div style="flex-grow: 1;"></div>
    <div class="mono">batt 78%</div>
    <div style="width: 32px; height: 32px; border: 1px solid rgba(26,25,20,0.18); border-radius: 2px; display: flex; align-items: center; justify-content: center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1914" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </div>
  </div>

  <!-- the reading, sat above its own trace -->
  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 16px 20px 10px;">
    <div style="display: flex; flex-direction: column; gap: 3px; padding-bottom: 6px;">
      <div class="mono">oven</div>
      <div class="mono" style="color: #1A1914; letter-spacing: 0.16em;">ready &#183; holding</div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 3px;">
      <div style="font-size: 62px; font-weight: 500; letter-spacing: -0.035em; line-height: 0.9; font-variant-numeric: tabular-nums;">193.4</div>
      <div style="font-size: 17px; font-weight: 500; color: #7A776C;">&#176;C</div>
    </div>
  </div>

  <!-- THE CHART IS THE SCREEN: 4m12s of oven temperature, three draws visible as notches -->
  <div style="display: flex; padding: 0 20px;">
    <div style="width: 26px; position: relative; height: 300px;">
      <div class="mono" style="position: absolute; right: 6px; top: -5px; letter-spacing: 0.04em;">225</div>
      <div class="mono" style="position: absolute; right: 6px; top: 64.2px; letter-spacing: 0.04em;">180</div>
      <div class="mono" style="position: absolute; right: 6px; top: 187.3px; letter-spacing: 0.04em;">100</div>
      <div class="mono" style="position: absolute; right: 6px; top: 290px; letter-spacing: 0.04em;">30</div>
    </div>
    <div style="flex-grow: 1;">
      <svg width="330" height="312" viewBox="0 0 330 312">
        <line x1="0" y1="0.5" x2="330" y2="0.5" stroke="rgba(26,25,20,0.10)" stroke-width="1"/>
        <line x1="0" y1="69.2" x2="330" y2="69.2" stroke="rgba(26,25,20,0.10)" stroke-width="1"/>
        <line x1="0" y1="192.3" x2="330" y2="192.3" stroke="rgba(26,25,20,0.10)" stroke-width="1"/>
        <line x1="0" y1="299.5" x2="330" y2="299.5" stroke="rgba(26,25,20,0.28)" stroke-width="1"/>
        <line x1="82.5" y1="0" x2="82.5" y2="300" stroke="rgba(26,25,20,0.06)" stroke-width="1"/>
        <line x1="165" y1="0" x2="165" y2="300" stroke="rgba(26,25,20,0.06)" stroke-width="1"/>
        <line x1="247.5" y1="0" x2="247.5" y2="300" stroke="rgba(26,25,20,0.06)" stroke-width="1"/>

        <line x1="0" y1="49.2" x2="292" y2="49.2" stroke="#B4471F" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="330" y="45" text-anchor="end" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="1" fill="#B4471F">TARGET 193</text>

        <path d="M 0 300 C 8 300 14 291 20 251 C 28 196 36 110 50 52 C 56 48 62 47 70 47 L 104 47 C 108 47 110 60 114 78 C 117 88 120 90 124 88 C 132 80 140 58 150 49 L 189 48 C 193 48 195 62 199 80 C 202 90 205 92 209 90 C 217 82 225 58 235 49 L 269 48 C 273 48 275 62 279 80 C 282 90 285 92 289 90 C 297 82 305 57 315 49 L 330 48.6 L 330 300 L 0 300 Z" fill="rgba(26,25,20,0.045)"/>
        <path d="M 0 300 C 8 300 14 291 20 251 C 28 196 36 110 50 52 C 56 48 62 47 70 47 L 104 47 C 108 47 110 60 114 78 C 117 88 120 90 124 88 C 132 80 140 58 150 49 L 189 48 C 193 48 195 62 199 80 C 202 90 205 92 209 90 C 217 82 225 58 235 49 L 269 48 C 273 48 275 62 279 80 C 282 90 285 92 289 90 C 297 82 305 57 315 49 L 330 48.6" fill="none" stroke="#1A1914" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="330" cy="48.6" r="3.4" fill="#1A1914"/>

        <line x1="114" y1="302" x2="114" y2="309" stroke="#B4471F" stroke-width="1.6"/>
        <line x1="199" y1="302" x2="199" y2="309" stroke="#B4471F" stroke-width="1.6"/>
        <line x1="279" y1="302" x2="279" y2="309" stroke="#B4471F" stroke-width="1.6"/>
        <text x="0" y="310" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="1" fill="#7A776C">4M AGO</text>
        <text x="330" y="310" text-anchor="end" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="1" fill="#7A776C">NOW</text>
      </svg>
    </div>
  </div>

  <!-- what the trace adds up to -->
  <div style="display: flex; margin: 14px 20px 0; border-top: 1px solid rgba(26,25,20,0.16); border-bottom: 1px solid rgba(26,25,20,0.16);">
    <div style="flex-grow: 1; padding: 9px 0;">
      <div class="mono">session</div>
      <div style="font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; padding-top: 1px;">4:12</div>
    </div>
    <div style="width: 1px; background: rgba(26,25,20,0.16);"></div>
    <div style="flex-grow: 1; padding: 9px 0 9px 14px;">
      <div class="mono">draws</div>
      <div style="font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; padding-top: 1px;">3</div>
    </div>
    <div style="width: 1px; background: rgba(26,25,20,0.16);"></div>
    <div style="flex-grow: 1; padding: 9px 0 9px 14px;">
      <div class="mono">held avg</div>
      <div style="font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; padding-top: 1px;">191&#176;</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- ONE control: the presets are detents on the target scale, not a second row of buttons -->
  <div style="padding: 0 20px 6px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 14px;">
      <div class="mono">target</div>
      <div style="display: flex; align-items: baseline; gap: 3px;">
        <div style="font-size: 26px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">193</div>
        <div style="font-size: 13px; font-weight: 500; color: #7A776C;">&#176;C</div>
      </div>
    </div>
    <div style="position: relative; height: 40px;">
      <div style="position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: rgba(26,25,20,0.22);"></div>
      <div style="position: absolute; left: 77.778%; right: 0; top: 11px; height: 2px; background: repeating-linear-gradient(90deg, rgba(26,25,20,0.4) 0 2px, transparent 2px 5px);"></div>
      <div style="position: absolute; left: 0; top: 5px; width: 1px; height: 14px; background: rgba(26,25,20,0.35);"></div>
      <div style="position: absolute; left: 28.889%; top: 5px; width: 1px; height: 14px; background: rgba(26,25,20,0.35);"></div>
      <div style="position: absolute; left: 53.333%; top: 5px; width: 1px; height: 14px; background: rgba(26,25,20,0.35);"></div>
      <div style="position: absolute; left: 77.778%; top: 5px; width: 1px; height: 14px; background: rgba(26,25,20,0.35);"></div>
      <div style="position: absolute; left: 28.889%; top: 0; width: 4px; margin-left: -2px; height: 24px; border-radius: 2px; background: #B4471F;"></div>
      <div class="mono" style="position: absolute; left: 0; top: 26px;">180</div>
      <div class="mono" style="position: absolute; left: 28.889%; top: 26px; margin-left: -14px; color: #B4471F;">193</div>
      <div class="mono" style="position: absolute; left: 53.333%; top: 26px; margin-left: -14px;">204</div>
      <div class="mono" style="position: absolute; right: 0; top: 26px;">215</div>
    </div>
  </div>

  <!-- mode as a run of labels, the live one underscored -->
  <div style="display: flex; gap: 4px; padding: 10px 20px 0; border-top: 1px solid rgba(26,25,20,0.16); margin: 0 0 0;">
    <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; border-top: 2px solid #1A1914; margin-top: -1px;">standard</div>
    <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 400; color: #7A776C;">boost</div>
    <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 400; color: #7A776C;">effic.</div>
    <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 400; color: #7A776C;">stealth</div>
    <div style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 400; color: #7A776C;">flavour</div>
  </div>

  <div style="height: 34px;"></div>
</div>
</x-dc>
</body>
</html>
