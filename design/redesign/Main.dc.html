<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", Helvetica, sans-serif; }
    a { color: #C0421C; } a:hover { color: #9C3516; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #D9D5CC; color: #1C1B18; display: flex; flex-direction: column; font-feature-settings: 'tnum' 1;">

  <div style="height: 44px;"></div>

  <!-- chassis label strip: the device says what it is, nothing more -->
  <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 24px;">
    <div style="width: 7px; height: 7px; background: #1C1B18;"></div>
    <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.02em;">pax 3</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 13px; font-weight: 400; color: #6B6960;">78%</div>
    <div style="width: 26px; height: 7px; border: 1px solid #6B6960; border-radius: 1px; padding: 1px; display: flex;">
      <div style="width: 78%; background: #6B6960;"></div>
    </div>
    <div style="width: 20px; height: 20px; border: 1px solid #1C1B18; border-radius: 2px; display: flex; align-items: center; justify-content: center;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1C1B18" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </div>
  </div>

  <!-- the readout plate -->
  <div style="margin: 14px 24px 0; background: #EFECE5; border-radius: 4px; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 2px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.07em; color: #6B6960;">oven temperature</div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="width: 6px; height: 6px; background: #1C1B18;"></div>
        <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.07em;">ready</div>
      </div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 4px; padding-top: 2px;">
      <div style="font-size: 82px; font-weight: 500; letter-spacing: -0.035em; line-height: 1;">193.4</div>
      <div style="font-size: 19px; font-weight: 500; color: #6B6960;">&#176;c</div>
    </div>
  </div>

  <!-- the scale: a printed tuner, actual as a solid bar, target as the one accent -->
  <div style="margin: 22px 24px 0; position: relative; height: 62px;">
    <div style="position: absolute; left: 0; right: 0; top: 18px; height: 8px; background: rgba(28,27,24,0.10); border-radius: 1px;"></div>
    <div style="position: absolute; left: 0; top: 18px; width: 29.778%; height: 8px; background: #1C1B18; border-radius: 1px;"></div>
    <!-- past 215 the oven scorches rather than vaporises: printed as a hatch, not a glow -->
    <div style="position: absolute; left: 77.778%; right: 0; top: 18px; height: 8px; background: repeating-linear-gradient(135deg, rgba(28,27,24,0.34) 0 1px, transparent 1px 4px); border-radius: 1px;"></div>

    <div style="position: absolute; left: 0; right: 0; top: 30px; height: 1px; background: rgba(28,27,24,0.28);"></div>
    <div style="position: absolute; left: 0; right: 0; top: 31px; height: 6px; background: repeating-linear-gradient(to right, rgba(28,27,24,0.32) 0 1px, transparent 1px calc(100% / 45));"></div>
    <div style="position: absolute; left: 0; right: 0; top: 31px; height: 11px; background: repeating-linear-gradient(to right, rgba(28,27,24,0.55) 0 1px, transparent 1px calc(100% / 9));"></div>
    <div style="position: absolute; right: 0; top: 31px; width: 1px; height: 11px; background: rgba(28,27,24,0.55);"></div>

    <div style="position: absolute; left: 0; right: 0; top: 46px; display: flex; justify-content: space-between; font-size: 10px; font-weight: 400; color: #6B6960;">
      <div>180</div><div>195</div><div>210</div><div>225</div>
    </div>

    <!-- target index -->
    <div style="position: absolute; left: 28.889%; top: 0; width: 0; height: 40px;">
      <div style="position: absolute; left: -1px; top: 8px; width: 2px; height: 32px; background: #C0421C;"></div>
      <div style="position: absolute; left: -5px; top: 0; width: 10px; height: 8px; background: #C0421C; clip-path: polygon(0 0, 100% 0, 50% 100%);"></div>
    </div>
  </div>

  <!-- target -->
  <div style="display: flex; align-items: center; gap: 10px; margin: 24px 24px 0;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.07em; color: #6B6960;">target</div>
      <div style="display: flex; align-items: baseline; gap: 3px;">
        <div style="font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.05;">193</div>
        <div style="font-size: 14px; font-weight: 500; color: #6B6960;">&#176;c</div>
      </div>
    </div>
    <div style="width: 52px; height: 46px; border-radius: 4px; background: #EFECE5; display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1C1B18" stroke-width="1.6"><path d="M3 8h10"/></svg>
    </div>
    <div style="width: 52px; height: 46px; border-radius: 4px; background: #EFECE5; display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1C1B18" stroke-width="1.6"><path d="M3 8h10M8 3v10"/></svg>
    </div>
  </div>

  <!-- presets -->
  <div style="display: flex; gap: 8px; margin: 12px 24px 0;">
    <div style="flex-grow: 1; height: 46px; border-radius: 4px; background: #EFECE5; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 400;">180&#176;</div>
    <div style="flex-grow: 1; height: 46px; border-radius: 4px; background: #C0421C; color: #F6F3EC; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;">193&#176;</div>
    <div style="flex-grow: 1; height: 46px; border-radius: 4px; background: #EFECE5; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 400;">204&#176;</div>
    <div style="flex-grow: 1; height: 46px; border-radius: 4px; background: #EFECE5; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 400;">215&#176;</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- heating mode as a five-position switch -->
  <div style="margin: 0 24px 26px;">
    <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.07em; color: #6B6960; padding-bottom: 8px;">heating mode</div>
    <div style="display: flex; background: #EFECE5; border-radius: 4px; overflow: hidden;">
      <div style="flex-grow: 1; height: 50px; background: #1C1B18; color: #EFECE5; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500;">standard</div>
      <div style="flex-grow: 1; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 400; color: #45443D; border-left: 1px solid rgba(28,27,24,0.14);">boost</div>
      <div style="flex-grow: 1; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 400; color: #45443D; border-left: 1px solid rgba(28,27,24,0.14);">effic.</div>
      <div style="flex-grow: 1; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 400; color: #45443D; border-left: 1px solid rgba(28,27,24,0.14);">stealth</div>
      <div style="flex-grow: 1; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 400; color: #45443D; border-left: 1px solid rgba(28,27,24,0.14);">flavour</div>
    </div>
  </div>

  <div style="height: 34px;"></div>
</div>
</x-dc>
</body>
</html>
