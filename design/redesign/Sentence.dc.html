<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
  <style>
    body { margin: 0; font-family: "Bricolage Grotesque", "Helvetica Neue", system-ui, sans-serif; }
    a { color: #14614A; } a:hover { color: #0D4633; }
    .set { color: #14614A; box-shadow: inset 0 -2px 0 rgba(20,97,74,0.28); }
    .tag { font-size: 10px; font-weight: 600; letter-spacing: 0.17em; text-transform: uppercase; color: rgba(20,19,15,0.42); }
  </style>
</helmet>

<!-- No components. The state is a sentence, and the words you can change are
     the controls. The accent colour IS the state: amber warming, green ready,
     blue cooling, grey offline. -->
<div style="width: 390px; height: 844px; background: #FFFDF8; color: #14130F; display: flex; flex-direction: column;">

  <div style="height: 44px;"></div>

  <div style="display: flex; align-items: center; height: 34px; padding: 0 28px;">
    <div class="tag">pax 3</div>
    <div style="flex-grow: 1;"></div>
    <div class="tag">linked</div>
  </div>

  <div style="padding: 44px 28px 0;">
    <div style="font-size: 68px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.94; color: #14614A;">Ready.</div>
    <div style="font-size: 29px; font-weight: 400; line-height: 1.42; letter-spacing: -0.015em; padding-top: 22px; text-wrap: pretty;">Holding <span class="set" style="font-weight: 600;">193&#176;</span> on <span class="set" style="font-weight: 600;">Standard</span>. The oven reads <span style="font-weight: 600;">193.4&#176;</span>, and the battery is at <span style="font-weight: 600;">78%</span>.</div>
  </div>

  <!-- the only graphic on the screen: a rule under the paragraph, filled from
       cold to now, so the typography carries the instrument -->
  <div style="padding: 30px 28px 0;">
    <div style="position: relative; height: 3px;">
      <div style="position: absolute; left: 0; right: 0; top: 1px; height: 1px; background: rgba(20,19,15,0.18);"></div>
      <div style="position: absolute; left: 0; width: 83.8%; top: 0; height: 3px; background: #14614A;"></div>
      <div style="position: absolute; left: 83.59%; top: -5px; width: 1px; height: 13px; background: rgba(20,19,15,0.5);"></div>
    </div>
    <div style="display: flex; justify-content: space-between; padding-top: 8px;">
      <div class="tag">cold</div>
      <div class="tag" style="padding-right: 14%;">target</div>
      <div class="tag">225&#176;</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- the controls are words, set as a run of links -->
  <div style="padding: 0 28px 10px;">
    <div class="tag" style="padding-bottom: 6px;">or jump to</div>
    <div style="display: flex; align-items: center; gap: 20px; height: 48px; font-size: 21px; font-weight: 400;">
      <div style="color: rgba(20,19,15,0.5);">180&#176;</div>
      <div class="set" style="font-weight: 600;">193&#176;</div>
      <div style="color: rgba(20,19,15,0.5);">204&#176;</div>
      <div style="color: rgba(20,19,15,0.5);">215&#176;</div>
    </div>
  </div>

  <div style="padding: 0 28px 20px;">
    <div class="tag" style="padding-bottom: 6px;">mode</div>
    <div style="display: flex; align-items: center; gap: 13px; height: 48px; font-size: 15px; font-weight: 400;">
      <div class="set" style="font-weight: 600;">standard</div>
      <div style="color: rgba(20,19,15,0.5);">boost</div>
      <div style="color: rgba(20,19,15,0.5);">efficiency</div>
      <div style="color: rgba(20,19,15,0.5);">stealth</div>
      <div style="color: rgba(20,19,15,0.5);">flavour</div>
    </div>
  </div>

  <div style="height: 34px;"></div>
</div>
</x-dc>
</body>
</html>
