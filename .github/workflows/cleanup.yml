# One-off housekeeping after iterating on the build pipeline.
#
# Scope, deliberately narrow:
#   - releases tagged build-* EXCEPT the one named in `keep`, with their tags
#   - the throwaway branch named in `branch`, if it still exists
#   - workflow runs EXCEPT the newest successful Build run and this run
# It touches no other branch and no release outside the build-* naming this
# pipeline creates.
#
# It deletes its own workflow file at the end, so the repo is left with a
# single workflow. Run it once; it is not part of the pipeline.
#
# Two runs survive this by design, and have to be removed by hand:
#   - this run itself - GitHub refuses to delete a run that is in progress
#   - the pages build its own commit triggers, while Pages deploys from the
#     branch (every push starts one)

name: Cleanup

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "The one build-* release to keep (blank = the newest)"
        type: string
        default: "build-36"
      branch:
        description: "Throwaway branch to delete (blank = none)"
        type: string
        default: "ci-validate"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      KEEP_INPUT: ${{ inputs.keep }}
      DROP_BRANCH: ${{ inputs.branch }}

    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run while a build is in flight
        # The self-removal commit below would race that build's own pushes,
        # and the run it is meant to keep may not exist yet.
        run: |
          set -euo pipefail
          BUSY=$(gh run list --repo "$REPO" --workflow "Build" --limit 20 \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$BUSY" != "0" ]; then
            echo "::error::$BUSY Build run(s) still going - wait for them, then re-run"
            exit 1
          fi

      - name: Delete old build-* releases
        run: |
          set -euo pipefail
          KEEP="$KEEP_INPUT"
          if [ -z "$KEEP" ]; then
            KEEP=$(gh release list --repo "$REPO" --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("build-"))]
                    | sort_by(.createdAt) | last | .tagName // empty')
          fi
          if [ -z "$KEEP" ]; then
            echo "No build-* releases found."
            exit 0
          fi
          # Never let a typo in the input wipe every release.
          if ! gh release view "$KEEP" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::release $KEEP does not exist - refusing to delete anything"
            exit 1
          fi
          echo "Keeping $KEEP"
          gh release list --repo "$REPO" --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("build-")) | .tagName' \
          | while read -r TAG; do
              [ "$TAG" = "$KEEP" ] && continue
              echo "Deleting release and tag $TAG"
              gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
            done

      - name: Delete the throwaway branch
        if: inputs.branch != ''
        run: |
          set -euo pipefail
          for PROTECTED in main master; do
            if [ "$DROP_BRANCH" = "$PROTECTED" ]; then
              echo "::error::refusing to delete $DROP_BRANCH"
              exit 1
            fi
          done
          if gh api "repos/$REPO/git/ref/heads/$DROP_BRANCH" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$DROP_BRANCH"
            echo "deleted branch $DROP_BRANCH"
          else
            echo "branch $DROP_BRANCH is already gone"
          fi

      - name: Remove this workflow from the repo
        # Before the run deletions: deleting our own run ends the job, and this
        # commit is the part that has to survive.
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # Build the commit on the current tip, in case the Build workflow
          # pushed generated files while this job was starting.
          git fetch -q origin main
          git reset -q --hard FETCH_HEAD
          git rm -q .github/workflows/cleanup.yml
          git commit -q -m "Remove the one-off cleanup workflow"
          git push origin HEAD:main

      - name: Delete old workflow runs
        run: |
          set -euo pipefail
          # Scoped to the default branch: the newest run overall may belong to
          # a throwaway branch this same job is deleting.
          KEEP_BUILD=$(gh run list --repo "$REPO" --workflow "Build" \
            --branch "${{ github.event.repository.default_branch }}" --limit 100 \
            --json databaseId,conclusion,createdAt \
            --jq '[.[] | select(.conclusion == "success")]
                  | sort_by(.createdAt) | last | .databaseId // empty')
          echo "Keeping Build run ${KEEP_BUILD:-none} and this run $GITHUB_RUN_ID"

          gh run list --repo "$REPO" --limit 300 --json databaseId --jq '.[].databaseId' \
          | while read -r ID; do
              [ "$ID" = "$KEEP_BUILD" ] && continue
              [ "$ID" = "$GITHUB_RUN_ID" ] && continue
              if gh api -X DELETE "repos/$REPO/actions/runs/$ID" >/dev/null 2>&1; then
                echo "deleted run $ID"
              else
                echo "could not delete run $ID (in progress, or already gone)"
              fi
            done

      - name: Delete this run
        run: |
          # Last on purpose: if it succeeds it terminates the job. GitHub
          # normally refuses to delete an in-progress run, so expect this to
          # fail and this run to stay in the list.
          gh api -X DELETE "repos/$REPO/actions/runs/$GITHUB_RUN_ID" \
            || echo "this run could not delete itself - remove it by hand"
