# One-off housekeeping after iterating on the build pipeline.
#
# Scope, deliberately narrow:
#   - releases tagged build-* EXCEPT the newest one, with their tags
#   - workflow runs EXCEPT the newest successful Build run and this run
# It touches no branches, no files other than its own, and no release that
# does not follow the build-* naming this pipeline creates.
#
# It deletes its own workflow file at the end, so the repo is left with a
# single workflow. Run it once; it is not part of the pipeline.

name: Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Delete old build-* releases
        run: |
          set -euo pipefail
          KEEP=$(gh release list --repo "$REPO" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))]
                  | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$KEEP" ]; then
            echo "No build-* releases found."
            exit 0
          fi
          echo "Keeping $KEEP"
          gh release list --repo "$REPO" --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("build-")) | .tagName' \
          | while read -r TAG; do
              [ "$TAG" = "$KEEP" ] && continue
              echo "Deleting release and tag $TAG"
              gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
            done

      - name: Remove this workflow from the repo
        # Before the run deletions: deleting our own run ends the job, and this
        # commit is the part that has to survive.
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # Build the commit on the current tip, in case the Build workflow
          # pushed generated files while this job was starting.
          git fetch -q origin main
          git reset -q --hard origin/main
          git rm -q .github/workflows/cleanup.yml
          git commit -q -m "Remove the one-off cleanup workflow"
          git push origin HEAD:main

      - name: Delete old workflow runs
        run: |
          set -euo pipefail
          KEEP_BUILD=$(gh run list --repo "$REPO" --workflow "Build" --limit 100 \
            --json databaseId,conclusion,createdAt \
            --jq '[.[] | select(.conclusion == "success")]
                  | sort_by(.createdAt) | last | .databaseId // empty')
          echo "Keeping Build run ${KEEP_BUILD:-none} and this run $GITHUB_RUN_ID"

          gh run list --repo "$REPO" --limit 300 --json databaseId --jq '.[].databaseId' \
          | while read -r ID; do
              [ "$ID" = "$KEEP_BUILD" ] && continue
              [ "$ID" = "$GITHUB_RUN_ID" ] && continue
              if gh api -X DELETE "repos/$REPO/actions/runs/$ID" >/dev/null 2>&1; then
                echo "deleted run $ID"
              else
                echo "could not delete run $ID (still running?)"
              fi
            done

      - name: Delete this run
        run: |
          # Last on purpose: this terminates the job.
          gh api -X DELETE "repos/$REPO/actions/runs/$GITHUB_RUN_ID" || true
