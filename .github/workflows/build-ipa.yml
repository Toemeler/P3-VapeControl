# Builds PaxController into a sideloadable (unsigned) IPA.
# - Publishes the IPA as a GitHub Release (and as a run artifact).
# - Publishes a SideStore/AltStore source feed to GitHub Pages so the release
#   can be installed and updated from inside the sideloader.
# Manual runs release as build-N; pushing a v* tag releases under that tag.

name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  screenshots:
    # Every release ships a current preview, so this runs on each build rather
    # than only when the app sources change.
    uses: ./.github/workflows/simulator-screenshots.yml

  build-ipa:
    name: Build PaxController for iOS
    needs: screenshots
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Stamp version
        id: version
        run: |
          set -euo pipefail
          PLIST=PaxController/Resources/Info.plist
          BASE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          # Monotonic third component so SideStore can tell builds apart and offer
          # updates. Stamped into the checkout only - the committed plist is untouched.
          VERSION="${BASE}.${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build both variants
        run: |
          set -o pipefail
          # Release: no log console, normal name and bundle id.
          .github/scripts/build_app.sh Release iphoneos \
            de.marcomeissner.PaxController "PAX Controller" 2>&1 | tee build.log
          mv build/Release-iphoneos/PaxController.app build/release.app
          # Debug: log console included, distinct name and bundle id so it can
          # sit next to the release build on the same device.
          .github/scripts/build_app.sh Debug iphoneos \
            de.marcomeissner.PaxController.debug "PAX Debug" 2>&1 | tee -a build.log

      - name: Package both IPAs
        id: package
        run: |
          set -euo pipefail
          .github/scripts/package_ipa.sh build/release.app PaxController.ipa
          .github/scripts/package_ipa.sh \
            build/Debug-iphoneos/PaxController.app PaxController-DEBUG.ipa

          echo "size=$(stat -f%z PaxController.ipa)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 PaxController.ipa | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "human_size=$(ls -lh PaxController.ipa | awk '{print $5}')" >> "$GITHUB_OUTPUT"

      - name: Fetch screenshots for the release
        uses: actions/download-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=PaxController ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=PaxController build #${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA as run artifact (non-fatal, short retention)
        # Account-wide artifact storage quota must never kill a finished build -
        # the GitHub Release below is the real distribution channel.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PaxController-ipa
          path: |
            PaxController.ipa
            PaxController-DEBUG.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Build SideStore source feed
        id: feed
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIZE: ${{ steps.package.outputs.size }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/make_icon.py icon.png
          python3 .github/scripts/make_source.py .
          echo "--- source feed ---"
          cat s.json

      - name: Publish IPA as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_URL: ${{ steps.feed.outputs.source_url }}
          SHORTCUT_URL: ${{ vars.SHORTCUT_URL }}
          SCREENSHOT_SHA: ${{ needs.screenshots.outputs.screenshots_sha }}
          IPA_SIZE: ${{ steps.package.outputs.human_size }}
        run: |
          set -euo pipefail
          python3 .github/scripts/render_notes.py notes.md
          gh release create "${{ steps.tag.outputs.tag }}" \
            PaxController.ipa \
            PaxController-DEBUG.ipa \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.title }}" \
            --notes-file notes.md

      - name: Commit source feed
        # Committed rather than deployed with actions/deploy-pages: the Actions
        # token is not allowed to create the Pages site itself. This makes the
        # feed reachable over raw.githubusercontent.com immediately, and over
        # Pages as soon as Pages is switched on for the branch.
        run: |
          set -euo pipefail
          # The screenshots were downloaded from the other job purely to attach
          # them to the release; that job commits them itself. Leaving them here
          # untracked makes the rebase below refuse to overwrite them.
          rm -rf screenshots
          # The plist was version-stamped for the build; keep that out of the commit.
          git checkout -- PaxController/Resources/Info.plist
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add s.json apps.json icon.png index.html
          if git diff --cached --quiet; then
            echo "source feed unchanged"
            exit 0
          fi
          git commit -m "Update source feed for ${{ steps.tag.outputs.tag }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
