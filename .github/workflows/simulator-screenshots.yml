# Smoke-launches the app in an iPhone 14 simulator and captures screenshots.
# Bluetooth hardware does not exist in the simulator, so this proves the app
# builds, launches and renders - not that it can talk to a PAX.

name: Simulator screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PaxController/**"
      - "PaxController.xcodeproj/**"
      - ".github/workflows/simulator-screenshots.yml"

permissions:
  contents: write

jobs:
  screenshots:
    name: Launch in simulator and screenshot
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project PaxController.xcodeproj \
            -target PaxController \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee simbuild.log

      - name: Pick a simulator
        id: sim
        run: python3 .github/scripts/pick_simulator.py

      - name: Boot simulator
        id: boot
        timeout-minutes: 10
        run: |
          set -euo pipefail
          NAME="${{ steps.sim.outputs.device_name }}"
          # Reuse a device the runner image already created - creating a fresh one
          # and booting it is what stalls, and a preinstalled device is warm.
          UDID="${{ steps.sim.outputs.existing_udid }}"
          if [ -z "$UDID" ]; then
            echo "No preinstalled $NAME; creating one."
            UDID=$(xcrun simctl create "ci-screenshots" \
              "${{ steps.sim.outputs.device_type }}" "${{ steps.sim.outputs.runtime }}")
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

          # simctl bootstatus -b hangs indefinitely on these runners, so boot
          # without blocking and poll for the state ourselves.
          xcrun simctl boot "$UDID" || true
          STATE=Unknown
          for _ in $(seq 1 90); do
            STATE=$(python3 .github/scripts/simctl_helper.py state "$UDID")
            [ "$STATE" = "Booted" ] && break
            sleep 5
          done
          if [ "$STATE" != "Booted" ]; then
            echo "::error::simulator never reached Booted (last state: $STATE)"
            exit 1
          fi

          # Booted is not the same as ready: wait until the system container
          # answers, otherwise install races SpringBoard coming up.
          for _ in $(seq 1 60); do
            if xcrun simctl spawn "$UDID" launchctl print system >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          xcrun simctl status_bar "$UDID" override \
            --time "09:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiMode active --wifiBars 3 || true

      - name: Install and launch
        timeout-minutes: 8
        env:
          UDID: ${{ steps.boot.outputs.udid }}
        run: |
          set -euo pipefail
          APP="build/Debug-iphonesimulator/PaxController.app"
          ls -la "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --console-pty "$UDID" de.marcomeissner.PaxController &
          sleep 12
          # A crashed app leaves no running process - catch that before screenshotting
          # something misleading like an empty springboard.
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q marcomeissner; then
            echo "::error::app is not running after launch - it likely crashed"
            xcrun simctl spawn "$UDID" log show --last 2m --predicate \
              'process == "PaxController"' --style compact | tail -n 100 || true
            exit 1
          fi

      - name: Capture screenshots
        env:
          UDID: ${{ steps.boot.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p screenshots
          xcrun simctl ui "$UDID" appearance light
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/01-scan-light.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/02-scan-dark.png
          ls -lh screenshots

      - name: Record what the screenshots show
        env:
          DEVICE: ${{ steps.sim.outputs.device_name }}
          RUNTIME: ${{ steps.sim.outputs.runtime_name }}
        run: |
          printf '%s\n' \
            "# Simulator screenshots" \
            "" \
            "Captured automatically by the \`Simulator screenshots\` workflow." \
            "" \
            "- Device: $DEVICE" \
            "- Runtime: $RUNTIME" \
            "- Run: ${{ github.run_id }}" \
            "" \
            "The simulator has no Bluetooth radio, so the app shows its" \
            "disconnected scan screen. These confirm the app builds, launches" \
            "and renders; they do not exercise the PAX connection." \
            > screenshots/README.md

      - name: Commit screenshots
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            exit 0
          fi
          git commit -m "Update simulator screenshots (run ${{ github.run_id }})"
          # Another run may have landed first; rebase rather than fail the job.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build-log
          path: simbuild.log
          if-no-files-found: ignore
